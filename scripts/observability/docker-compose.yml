# Prometheus + Grafana for the DKM gateway, pre-provisioned: bring it up and the
# dashboard is already there with the data source wired in.
#
#   docker compose -f scripts/observability/docker-compose.yml up -d
#   open http://localhost:3000        (anonymous, no login)
#
# A one-second scrape interval is far finer than a normal service would want.
# It is right here: a replay run lasts seconds, and a lag spike that lasts one
# second is exactly the thing worth seeing.
services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: dkm-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.5.1
    container_name: dkm-grafana
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dkm-gateway.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
